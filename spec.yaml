id: incident_storyboard

metadata:
  name: Incident Storyboard
  description: >-
    Shows each EarthRanger incident as a storyboard: its events in time order, as event-type
    icons framed in their event-type colour, with the time between events on the arrows. All
    of an incident's events are included, even those dated outside the time range. Group by
    incident for one dashboard view per incident. Also saves the incident events as GeoParquet.
  maintainers:
    - name: Zakariya Husayn
      email: zakariya@wildlifedynamics.com
      role: owner
    - name: Yun Wu
      email: yun@wildlifedynamics.com
      role: reviewer
  outputs:
    - name: Incident Storyboards
      type: plot
      description: >-
        One row per incident, newest first. Same-type events close in time share one tile (xN),
        and events without a location are marked.
      indicators:
        - name: Incidents
    - name: Incident Events
      type: file
      description: >-
        One row per incident event, with the incident's columns, display names, event details,
        icon and event-type colour, as GeoParquet.
      indicators:
        - name: Incidents
  license: BSD-3-Clause
  repository: https://github.com/wildlife-dynamics/incident-storyboard
  documentation: https://github.com/wildlife-dynamics/incident-storyboard#readme
  readme: README.md
  keywords: [incidents, events, storyboard, earthranger]
  thumbnail: resources/thumbnail.png

requirements:
  # 2.39.4: the storyboard shows tile times in the time range's timezone, not UTC
  # (2.39.3 added its PNG download button).
  - name: ecoscope-platform
    version: ">=2.39.4,<3.0.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  # ecoscope-platform requires pydeck==0.9.2, which is only on conda-forge;
  # pinned explicitly so strict channel priority can resolve it.
  - name: pydeck
    version: 0.9.2
    channel: conda-forge

rjsf-overrides:
  properties:
    time_range.description: >-
      Choose the period. Incidents created in this period are included, with all
      of their events.

    groupers.properties.groupers.description: >-
      Choose Incident for one view per incident (optional). Leave empty for one
      view of all incidents.
    groupers.properties.groupers.items.anyOf:
      - "$ref": "#/$defs/ValueGrouper"

    Storyboard.properties.storyboards.properties.merge_window_hours.title: Merge window (hours)

  $defs:
    ValueGrouper.properties.index_name.oneOf:
      - const: incident
        title: Incident

  uiSchema:
    groupers.groupers.items.anyOf:
      - ui:options:
          label: false

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:
  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Data Source
    id: er_client
    task: set_er_connection

  - name: Time Range
    id: time_range
    task: set_time_range
    partial:
      time_format: "%d %b %Y %H:%M:%S %Z"

  - id: get_timezone
    task: get_timezone_from_time_range
    partial:
      time_range: ${{ workflow.time_range.return }}

  - name: Group by
    id: groupers
    task: set_groupers

  - title: Incidents
    type: task-group
    description: Download the incidents and all of their events.
    tasks:
      - id: incident_events
        task: get_incident_events
        partial:
          client: ${{ workflow.er_client.return }}
          time_range: ${{ workflow.time_range.return }}
          # Not in the form: no site has incidents inside incidents yet. Nested
          # incidents are still followed up to 5 levels deep.
          max_depth: 5
          # Not in the form: the storyboard is built around the icons.
          include_icons: true

      - id: events_local_time
        task: convert_values_to_timezone
        partial:
          df: ${{ workflow.incident_events.return }}
          timezone: ${{ workflow.get_timezone.return }}
          columns:
            - time

      # Colours are assigned once, before splitting, so an event type keeps its
      # colour in every view. The most common type gets the first colour (ties by
      # name), so the colours don't depend on row order. The same list is used by
      # every workflow split out of the incident report, so they agree side by side.
      - id: event_type_colors
        task: color_map_by_frequency
        partial:
          df: ${{ workflow.events_local_time.return }}
          input_column_name: event_type_display
          colormap:
            - "#2a78d6"
            - "#eb6834"
            - "#1baf7a"
            - "#eda100"
            - "#e87ba4"
            - "#008300"
            - "#6250d6"
            - "#e34948"
            - "#0f9fb5"
            - "#8c5a3c"
            - "#a6b51b"
            - "#b14fc5"
            - "#1f4e8c"
            - "#7cc4f0"
            - "#9b2f5f"
            - "#d4a3e8"

      - id: incident_data
        task: apply_color_map
        partial:
          df: ${{ workflow.events_local_time.return }}
          input_column_name: event_type_display
          output_column_name: event_type_color
          colormap: ${{ workflow.event_type_colors.return }}

      - id: persist_incident_events
        task: persist_df
        partial:
          df: ${{ workflow.incident_data.return }}
          filetype: geoparquet
          filename: incident_events
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}

      - id: incidents_split
        task: split_groups
        partial:
          df: ${{ workflow.incident_data.return }}
          groupers: ${{ workflow.groupers.return }}

  - title: Storyboard
    type: task-group
    description: ""
    tasks:
      - id: storyboards
        task: draw_incident_storyboard
        # only merge_window_hours is left in the form; the columns are fixed by
        # get_incident_events and the colours by apply_color_map above
        partial:
          group_column: incident
          group_time_column: incident_time
          time_column: time
          type_column: event_type_display
          id_column: serial_number
          icon_column: icon
          color_column: event_type_color
          palette: null
        mapvalues:
          argnames: dataframe
          argvalues: ${{ workflow.incidents_split.return }}

      - id: storyboards_html
        task: persist_text
        partial:
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: incident_storyboards
        mapvalues:
          argnames: text
          argvalues: ${{ workflow.storyboards.return }}

      - id: storyboards_widget
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: Incident storyboards
        map:
          argnames: [view, data]
          argvalues: ${{ workflow.storyboards_html.return }}

      - id: storyboards_merged
        task: merge_widget_views
        skipif:
          conditions:
            - never
        partial:
          widgets: ${{ workflow.storyboards_widget.return }}

  - id: events_file
    task: create_files_single_view
    # no incidents in the period: the events file is skipped, and this step's
    # fallback gives an empty file list, so the dashboard still shows
    skipif:
      conditions:
        - never
    partial:
      files: ${{ workflow.persist_incident_events.return }}

  - name: Dashboard
    id: dashboard
    task: gather_dashboard
    partial:
      details: ${{ workflow.workflow_details.return }}
      widgets:
        - ${{ workflow.storyboards_merged.return }}
      groupers: ${{ workflow.groupers.return }}
      time_range: ${{ workflow.time_range.return }}
      files:
        - ${{ workflow.events_file.return }}
